[package]
name = "locus-render"
description = "Deterministic SVG, TikZ, and optional PNG backends for Locus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[features]
default = []
png = ["dep:resvg", "dep:png"]

[dependencies]
locus-core = { path = "../locus-core" }
locus-layout = { path = "../locus-layout" }
locus-syntax = { path = "../locus-syntax" }
locus-tex = { path = "../locus-tex" }
indexmap.workspace = true
libm.workspace = true
ryu.workspace = true
thiserror.workspace = true
roxmltree = "0.20"
svgtypes = "0.15"
resvg = { version = "=0.45.1", optional = true, default-features = false }
png = { version = "0.17.16", optional = true }

[dev-dependencies]
criterion = "0.8"
locus-tex = { path = "../locus-tex", features = ["rex"] }
insta.workspace = true
serde_json.workspace = true

[[bench]]
name = "pipeline"
harness = false

[lints]
workspace = true
