[package]
name = "locus-cli"
description = "Command-line interface for Locus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
publish = false

[[bin]]
name = "locus"
path = "src/main.rs"

[features]
default = []
png = ["locus-render/png"]

[dependencies]
clap.workspace = true
indexmap.workspace = true
locus-core = { path = "../locus-core" }
locus-layout = { path = "../locus-layout" }
locus-render = { path = "../locus-render" }
locus-tex = { path = "../locus-tex", features = ["rex"] }
locus-syntax = { path = "../locus-syntax" }
miette.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
assert_cmd.workspace = true
insta.workspace = true
tempfile = "3.20"
png = "0.17.16"

[lints]
workspace = true
