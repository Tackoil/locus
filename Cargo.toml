[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
authors = ["Locus contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indexmap = { version = "2.10", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy"] }
ryu = "1.0"
insta = "1.43"
assert_cmd = "2.0"
proptest = "1.7"
libm = "=0.2.15"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_types = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"

[profile.release]
lto = "thin"
strip = "symbols"
