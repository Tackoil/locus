name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  wasm:
    name: Browser WebAssembly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install WebAssembly target
        run: rustup target add wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.14.0 --locked
      - name: Build WebAssembly library
        run: wasm-pack build crates/locus-wasm --target web --release --no-opt --out-dir ../../target/wasm/pkg --out-name locus --locked
      - name: Test WebAssembly pipeline
        run: node crates/locus-wasm/tests/smoke.mjs --all

  zed-extension:
    name: Zed extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ecosystem/tree-sitter-locus/package-lock.json
      - name: Install grammar development tools
        run: npm ci --prefix ecosystem/tree-sitter-locus
      - name: Check generated grammar
        run: |
          npm run generate --prefix ecosystem/tree-sitter-locus
          git diff --exit-code -- ecosystem/tree-sitter-locus/src
      - name: Test grammar and Zed queries
        run: npm test --prefix ecosystem/tree-sitter-locus
      - name: Prepare local Zed extension
        run: python3 ecosystem/zed/prepare.py
      - name: Install extension compilation target
        run: rustup target add wasm32-wasip2
      - name: Check extension formatting
        run: cargo fmt --manifest-path ecosystem/zed/Cargo.toml -- --check
      - name: Check extension with Clippy
        run: cargo clippy --manifest-path ecosystem/zed/Cargo.toml --locked --target wasm32-wasip2 -- -D warnings
      - name: Build extension for Zed
        run: cargo build --manifest-path ecosystem/zed/Cargo.toml --locked --release --target wasm32-wasip2

  quality:
    name: Specification, formatting, and Clippy (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check normative specification artifacts
        run: python3 scripts/check_examples.py
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-features --all-targets -- -D warnings

  test:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Build the workspace
        run: cargo build --workspace --all-features --all-targets
      - name: Test the workspace
        run: cargo test --workspace --all-features --all-targets
